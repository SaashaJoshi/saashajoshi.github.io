params:
  title: "Saasha Joshi"
  description: Quantum Research Scientist | Quantum Machine Learning & Optimization
  # staticPath: ""  # The path to serve the static files from
  favicon: "/Saasha_Joshi_circle_yellow.png"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # color preference
  # When using hex codes for colors, quotations must be used along with the # sign
  color:
     textColor: "#343a40"
     secondaryTextColor: "#6c757d"
     backgroundColor: "#eaedf0"
     secondaryBackgroundColor: "#64ffda1a"
     primaryColor: "#007bff"
     secondaryColor: "#f8f9fa"

     darkmode:
       textColor: "#e4e6eb"
       secondaryTextColor: "#b0b3b8"
       backgroundColor: "#18191a"
       secondaryBackgroundColor: "#212529"
       primaryColor: "#FE036A"
#       "#ffffff"
       secondaryColor: "#212529"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "Saasha Joshi" # Brand name for the brand | default is the title variable
    disableSearch: false
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableCertifications: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hi, I am"
    title: "Saasha Joshi"
    subtitle: "Quantum Research Scientist"
    content: "Specialized in Quantum Machine Learning, Quantum Algorithms, and Optimization."
    image: /images/Saasha_Joshi_cropped_.jpeg
    roundImage: true
    bottomImage:
      enable: true
#      roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "Resume"
      url: "/static/Saasha_Joshi_Resume_April_2024.pdf"
      download: true
      newPage: true
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/SaashaJoshi
        - icon: fab fa-x-twitter
          url: https://twitter.com/sassy_joshy
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/saashajoshi/
        - icon: fab fa-medium
          url: https://medium.com/@saashajoshi
        - icon: fas fa-graduation-cap
          url: https://scholar.google.ca/citations?user=DXyC8HQAAAAJ&hl=en&oi=ao
      # customIcons:
      #   - icon: /fav.png
      #     url: "https://example.com"

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.png"
    content: |-
      I am a Quantum Research Scientist with expertise in quantum machine learning, quantum algorithms, and optimization. I have experience in applied research, experimental evaluation, and translating quantum research into practical applications across industry and research environments.

      I am actively engaged in education and outreach activities. I believe in contributing meaningfully to the quantum community as an open source software developer and a Qiskit Advocate.
    skills:
      enable: true
      title: "Key Research and Technical Areas:"
      items:
        - "Quantum Machine Learning"
        - "Quantum Algorithms"
        - "Quantum Optimization"
        - "Kernel Methods & Gaussian Processes"
        - "Deep Learning & Generative AI"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - job: "Staff Scientist - Quantum Computing"
        company: "CMC Microsystems"
        companyUrl: "https://cmc.ca/"
        date: "June 2024 - Present"
        info:
          enable: false
        featuredLink:
          enable: false
          name: "View the project"
          url: "https://example.com"
        content: |
          Lead applied research projects on quantum machine learning, algorithms, and optimization. Design and evaluate quantum and hybrid quantum-classical methods through computational experiments and benchmarking. Contribute to research publications, technical reports, and experimental studies on emerging quantum computing methods.

      - job: "Quantum Research Software Developer Intern"
        company: "IBM Research (Quantum)"
        companyUrl: "https://www.ibm.com/quantum"
        date: "May 2023 - August 2023"
        info:
          enable: false
        content: |
          Developed quantum error mitigation and circuit knitting workflows for distributed quantum circuit execution using Qiskit. Collaborated with quantum researchers and engineers on experimental workflows for near-term quantum systems.

      - job: "Quantum Research Software Developer Intern"
        company: "IBM Research (Quantum)"
        companyUrl: "https://www.ibm.com/quantum"
        date: "May 2022 - August 2022"
        info:
          enable: false
        content: |
          Developed and benchmarked quantum chemistry simulation workflows for Qiskit Nature. Contributed research-driven functionality to open-source quantum software infrastructure.

      - job: "Graduate Research Assistant"
        company: "University of Victoria"
        companyUrl: "https://www.uvic.ca/"
        date: "September 2021 - June 2024"
        info:
          enable: false
        content: |
          Conducted research in quantum machine learning and quantum algorithms. Developed and evaluated piQture, a quantum machine learning library for image processing and experimental QML workflows.

      - job: "Quantum Computing Intern"
        company: "Tech Mahindra Limited"
        companyUrl: "https://www.techmahindra.com/"
        date: "January 2021 - June 2021"
        info:
          enable: false
        content: |
          Researched and implemented quantum algorithms for enterprise-oriented applications.

